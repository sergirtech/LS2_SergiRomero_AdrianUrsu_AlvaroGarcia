spring.application.name=protube-back
server.port=8080
spring.thymeleaf.prefix=classpath:/static/

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=101MB

spring.jpa.hibernate.ddl-auto=update

spring.profiles.active=@spring.profiles.active@

# Override ENV_PROTUBE_STORE_DIR to use a video store outside the repository.
# By default, when started from backend/, use the repository's tooling/videos folder.
pro_tube.store.dir=${ENV_PROTUBE_STORE_DIR:${user.dir}/../tooling/videos/}

pro_tube.google.client-id=${ENV_PROTUBE_GOOGLE_CLIENT_ID:}
pro_tube.google.client-secret=${ENV_PROTUBE_GOOGLE_CLIENT_SECRET:}

#---
spring.config.activate.on-profile=dev
pro_tube.load_initial_data=true
pro_tube.frontend.url=${ENV_PROTUBE_FRONTEND_URL:http://localhost:5173}
spring.datasource.url=jdbc:h2:mem:mydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.platform=h2
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

#---
spring.config.activate.on-profile=prod
pro_tube.load_initial_data=false
pro_tube.frontend.url=${ENV_PROTUBE_FRONTEND_URL:/}
# For a simpler approach you can reuse the h2 from dev (adjust other config properly)
# spring.datasource.url=jdbc:h2:mem:mydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.url=jdbc:postgresql://${ENV_PROTUBE_DB_HOST:localhost}:${ENV_PROTUBE_DB_PORT:5432}/${ENV_PROTUBE_DB}
spring.datasource.username=${ENV_PROTUBE_DB_USER}
spring.datasource.password=${ENV_PROTUBE_DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.mvc.static-path-pattern=/media/**
logging.level.org.springframework.web=DEBUG
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
